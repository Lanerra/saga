[tool.ruff]
line-length = 200
target-version = "py312"
# Frozen historical evidence; report its diagnostics separately, as with Mypy.
extend-exclude = ["docs/audits/2026-09-06"]

[tool.ruff.lint]
select = ["F", "B", "I", "UP"] # flake8, flake8-bugbear, isort, pyupgrade
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
disallow_untyped_defs = true
check_untyped_defs = true
namespace_packages = false
show_error_codes = true
# Frozen audit evidence is not maintained application, test or operational code.
exclude = ['^docs/audits/2026-09-06/']
# Enable the Pydantic plugin for enhanced type checking
plugins = ["pydantic.mypy"]
# Specifies the path for mypy to check

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
required_plugins = ["pytest-asyncio==1.0.0", "pytest-cov==5.0.0", "pytest-timeout==2.4.0"]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = [
    "-v",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
    "--asyncio-mode=auto"
]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 600
markers = [
    "unbound_settings: test owns new-run/default configuration scope; all offline guards remain active",
    "run_settings: explicit validated synthetic run settings supplied as keyword arguments",
    "performance: marks tests as performance tests (deselect with '-m \"not performance\"')",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running tests",
    "unit: marks tests as unit tests",
    "checkpoint: marks tests that use checkpoint functionality",
    "ui: marks tests that test UI performance",
    "fault_injection: marks tests that inject faults for testing"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:unclosed.*:ResourceWarning"
]
