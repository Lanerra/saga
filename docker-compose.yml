services:
  neo4j-apoc:
    # Disposable synthetic storage only; no host story directories are mounted.
    image: neo4j:5.26.8
    ports:
      - "127.0.0.1:${SAGA_DISPOSABLE_BOLT_PORT:?Select an unused disposable Bolt port}:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set a disposable password of at least eight characters}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
      - NEO4J_server_jvm_additional=-XX:ActiveProcessorCount=2
      - NEO4J_server_http_enabled=false
      - NEO4J_server_https_enabled=false
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_PLUGINS=["apoc"]
    restart: "no"
